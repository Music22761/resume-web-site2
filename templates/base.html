<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ r.name }} — {{ r.title }}{% endblock %}</title>
  <meta name="description" content="{{ r.about | truncate(150) }}">
  <meta name="theme-color" content="#4f46e5">
  <script>
    // Set theme before first paint to avoid a light/dark flash
    (function () {
      var root = document.documentElement, saved = null;
      root.classList.add('js');
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      root.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename=r.photo) }}">
</head>
<body>
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
